databaseChangeLog:
  - changeSet:
      id: 001-create-accounts
      author: ankita
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: owner_name, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: currency, type: VARCHAR(3), constraints: {nullable: false}}
              - column: {name: balance, type: NUMERIC(19,4), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}

  - changeSet:
      id: 002-create-payments
      author: ankita
      changes:
        - createTable:
            tableName: payments
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: source_account_id, type: UUID, constraints: {nullable: false}}
              - column: {name: destination_account_id, type: UUID, constraints: {nullable: false}}
              - column: {name: amount, type: NUMERIC(19,4), constraints: {nullable: false}}
              - column: {name: currency, type: VARCHAR(3), constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: idempotency_key, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: payments
            columnNames: idempotency_key
            constraintName: uk_payments_idempotency_key

  - changeSet:
      id: 003-create-ledger
      author: ankita
      changes:
        - createTable:
            tableName: ledger_entries
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: account_id, type: UUID, constraints: {nullable: false}}
              - column: {name: payment_id, type: UUID}
              - column: {name: entry_type, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: amount, type: NUMERIC(19,4), constraints: {nullable: false}}
              - column: {name: balance_after, type: NUMERIC(19,4), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
